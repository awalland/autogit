[workspace]
resolver = "2"
members = [
    "autogit-daemon",
    "autogit",
    "autogit-shared",
]

[workspace.package]
version = "0.9.0"
edition = "2024"
authors = ["Armin Walland <armin@wal.land>"]
license = "WTFPL"

[workspace.dependencies]
# Shared dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.2"
anyhow = "1.0"
thiserror = "2.0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6.0.0"

# Git operations
git2 = "0.20.4"

# File watching
notify = "9.0.0-rc.4"

# CLI
clap = { version = "4.6", features = ["derive"] }
dialoguer = "0.12"

# Async runtime (if needed later)
tokio = { version = "1.52", features = ["full"] }

# Tests
tempfile = "3.27"
serial_test = "3.4"

[profile.release]
strip = true
