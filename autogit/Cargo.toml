[package]
name = "autogit"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "autogit"
path = "src/main.rs"

[dependencies]
autogit-shared = { path = "../autogit-shared" }

# Core dependencies
anyhow.workspace = true
tokio = { workspace = true }

# CLI
clap.workspace = true
dialoguer.workspace = true
shell-words = "1.1"

# For colored output
colored = "3.1.1"

# Table formatting
tabled = { version = "0.20.0", default-features = false, features = ["std", "macros", "assert"] }

[dev-dependencies]
tempfile.workspace = true

[build-dependencies]
clap = { workspace = true }
clap_complete = "4.6"
